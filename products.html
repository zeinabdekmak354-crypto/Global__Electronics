<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Global Electronics</title>
  <link rel="stylesheet" href="GE.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">GE</div>
  <ul>
    <li><a href="index.html">Home</a></li>
  </ul>
  <button class="cart-btn" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button>
</nav>

<section class="section">
  <h2 id="categoryTitle">Products</h2>
  <p class="intro-text">Choose your favorite product and add it to your cart.</p>

  <div class="product-grid" id="productContainer"></div>
</section>

<div class="cart-panel" id="cartPanel">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3>Total: $<span id="cartTotal">0</span></h3>
  <button onclick="clearCart()">Clear Cart</button>
  <button onclick="closeCart()">Close</button>
</div>

<script src="GE.js"></script>
</body>
</html>
